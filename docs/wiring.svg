<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>CP2112 test wiring</title>
<rect width="680" height="440" fill="#ffffff"/>
<rect x="70" y="50" width="180" height="210" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="150" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">CP2112</text>
<text x="150" y="98" text-anchor="middle" font-size="12" fill="#534AB7">USB to PC</text>
<g font-size="14" fill="#3C3489" text-anchor="end">
<text x="238" y="135">VCC</text><text x="238" y="170">GND</text><text x="238" y="205">SDA</text><text x="238" y="240">SCL</text>
</g>
<rect x="440" y="60" width="190" height="150" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<g font-size="14" fill="#444441"><text x="452" y="95">VIN</text><text x="452" y="125">GND</text><text x="452" y="155">SCL</text><text x="452" y="185">SDA</text></g>
<text x="570" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Sensor 1</text>
<text x="570" y="148" text-anchor="middle" font-size="12" fill="#5F5E5A">e.g. BME280</text>
<rect x="440" y="230" width="190" height="150" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<g font-size="14" fill="#444441"><text x="452" y="265">VCC</text><text x="452" y="295">GND</text><text x="452" y="325">SCL</text><text x="452" y="355">SDA</text></g>
<text x="570" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Sensor 2</text>
<text x="570" y="318" text-anchor="middle" font-size="12" fill="#5F5E5A">optional, same 4 wires</text>
<g fill="none" stroke-width="2.2" stroke-linecap="round">
<path d="M250 130 H290 M290 90 V260 M290 90 H440 M290 260 H440" stroke="#E24B4A"/>
<path d="M250 165 H315 M315 120 V290 M315 120 H440 M315 290 H440" stroke="#555555"/>
<path d="M250 200 H340 M340 180 V350 M340 180 H440 M340 350 H440" stroke="#378ADD"/>
<path d="M250 235 H365 M365 150 V320 M365 150 H440 M365 320 H440" stroke="#EF9F27"/>
</g>
<g>
<circle cx="290" cy="130" r="3.5" fill="#E24B4A"/><circle cx="315" cy="165" r="3.5" fill="#555555"/>
<circle cx="340" cy="200" r="3.5" fill="#378ADD"/><circle cx="365" cy="235" r="3.5" fill="#EF9F27"/>
</g>
<g font-size="12" fill="#444441">
<line x1="90" y1="410" x2="120" y2="410" stroke="#E24B4A" stroke-width="2.2"/><text x="128" y="414">VCC 3.3 V</text>
<line x1="230" y1="410" x2="260" y2="410" stroke="#555555" stroke-width="2.2"/><text x="268" y="414">GND</text>
<line x1="340" y1="410" x2="370" y2="410" stroke="#378ADD" stroke-width="2.2"/><text x="378" y="414">SDA (data)</text>
<line x1="480" y1="410" x2="510" y2="410" stroke="#EF9F27" stroke-width="2.2"/><text x="518" y="414">SCL (clock)</text>
</g>
</svg>

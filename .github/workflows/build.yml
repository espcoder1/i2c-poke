name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the .exe to this existing release tag (e.g. V1.0). Leave blank to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hidapi pillow pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name I2CPoke --hidden-import hid i2cpoke_gui.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: I2CPoke-windows
          path: dist/I2CPoke.exe
      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: dist/I2CPoke.exe
